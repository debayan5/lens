name: Lens
options:
  bundleIdPrefix: com.debayan
  deploymentTarget:
    iOS: "16.0"
targets:
  Lens:
    type: application
    platform: iOS
    sources:
      - LensApp.swift
      - CameraModel.swift
      - ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debayan.lens
        PRODUCT_NAME: Lens
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "Lens uses the camera to take photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Lens saves your photos to your library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  Lens:
    build:
      targets:
        Lens: all

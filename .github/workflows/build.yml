name: Build IPA
on:
  workflow_dispatch:        # manual only: Actions tab > Build IPA > Run workflow
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate app icon
        run: swift make_icon.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Lens.xcodeproj -scheme Lens -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lens.app Payload/
          zip -r Lens.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Lens-ipa
          path: Lens.ipa
      - name: Publish release and source.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          export VER=$(grep -m1 MARKETING_VERSION project.yml | sed 's/.*"\(.*\)".*/\1/')
          export SIZE=$(stat -f%z Lens.ipa)
          TAG="v$VER"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Lens.ipa --title "Lens $VER" --notes "Lens $VER"
          cp Assets.xcassets/AppIcon.appiconset/icon.png icon.png
          python3 - <<'PY'
          import json, os, datetime
          ver, repo = os.environ["VER"], os.environ["REPO"]
          try:
              ch = json.load(open("changelog.json"))
              entry = next((v for v in ch["versions"] if v["version"] == ver), ch["versions"][0])
              notes = "\n".join("- " + c for c in entry["changes"])
          except Exception:
              notes = ""
          notes = notes or f"Lens {ver}"
          raw = f"https://raw.githubusercontent.com/{repo}/main"
          today = datetime.date.today().isoformat()
          url = f"https://github.com/{repo}/releases/download/v{ver}/Lens.ipa"
          size = int(os.environ["SIZE"])
          app = {
              "name": "Lens",
              "bundleIdentifier": "com.debayan.lens",
              "developerName": "Debayan",
              "subtitle": "Native iPhone camera",
              "localizedDescription": "Native iPhone camera with PNG and RAW capture, Portrait and Low Light modes.",
              "iconURL": f"{raw}/icon.png",
              "tintColor": "FFCC00",
              "beta": False,
              "screenshotURLs": [],
              "version": ver,
              "versionDate": today,
              "versionDescription": notes,
              "size": size,
              "downloadURL": url,
              "versions": [{
                  "version": ver,
                  "date": today,
                  "size": size,
                  "downloadURL": url,
                  "localizedDescription": notes,
                  "minOSVersion": "16.0",
              }],
          }
          src = {
              "name": "Lens",
              "identifier": "com.debayan.lens.source",
              "subtitle": "Lens camera builds",
              "description": "Builds of the Lens camera app.",
              "iconURL": f"{raw}/icon.png",
              "website": f"https://github.com/{repo}",
              "tintColor": "FFCC00",
              "sourceURL": f"{raw}/source.json",
              "apps": [app],
              "news": [],
          }
          json.dump(src, open("source.json", "w"), indent=2)
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -q --ignore-unmatch esign.json CHANGELOG.md
          git add source.json icon.png
          git commit -m "Update source to $VER" || true
          git pull --rebase
          git push

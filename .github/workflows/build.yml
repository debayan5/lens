name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate app icon
        run: swift make_icon.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Lens.xcodeproj -scheme Lens -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Lens.app Payload/
          zip -r Lens.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Lens-ipa
          path: Lens.ipa
      - name: Publish release and ESign source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          export VER=$(grep -m1 MARKETING_VERSION project.yml | sed 's/.*"\(.*\)".*/\1/')
          export SIZE=$(stat -f%z Lens.ipa)
          TAG="v$VER"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Lens.ipa --title "Lens $VER" --notes "Lens $VER"
          cp Assets.xcassets/AppIcon.appiconset/icon.png icon.png
          python3 - <<'PY'
          import json, os, re, datetime
          ver, repo = os.environ["VER"], os.environ["REPO"]
          try:
              txt = open("CHANGELOG.md").read()
              m = re.search(r"\n## [^\n]*\n(.*?)(?=\n## |\Z)", txt, re.S)
              notes = m.group(1).strip() if m else ""
          except Exception:
              notes = ""
          raw = f"https://raw.githubusercontent.com/{repo}/main"
          app = {
              "name": "Lens",
              "bundleIdentifier": "com.debayan.lens",
              "developerName": "Debayan",
              "subtitle": "Native iPhone camera",
              "version": ver,
              "versionDate": datetime.date.today().isoformat(),
              "size": int(os.environ["SIZE"]),
              "downloadURL": f"https://github.com/{repo}/releases/download/v{ver}/Lens.ipa",
              "localizedDescription": "Native iPhone camera with PNG and RAW capture, Portrait and Low Light modes.",
              "versionDescription": notes,
              "iconURL": f"{raw}/icon.png",
          }
          src = {
              "name": "Lens",
              "identifier": "com.debayan.lens.source",
              "subtitle": "Lens camera builds",
              "iconURL": f"{raw}/icon.png",
              "apps": [app],
          }
          json.dump(src, open("esign.json", "w"), indent=2)
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add esign.json icon.png
          git commit -m "Update ESign source to $VER" || true
          git pull --rebase
          git push
